[package]
name = "agent"
version = "0.1.1"
description = "Virtual Stream Deck — PC agent"
authors = ["Stream Deck Virtual"]
edition = "2021"

[lib]
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs", "process"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
dirs = "5"
base64 = "0.22"
axum = "0.7"
tower = "0.5"
rust-embed = "8"
mime_guess = "2"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

